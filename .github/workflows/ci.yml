name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treasury_migrator
          POSTGRES_PASSWORD: treasury
          POSTGRES_DB: treasury_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasury_migrator -d treasury_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATOR_DATABASE_URL: postgresql://treasury_migrator:treasury@localhost:5432/treasury_test
      DATABASE_URL: postgresql://treasury_app:treasury@localhost:5432/treasury_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create restricted app role
        run: |
          PGPASSWORD=treasury psql -h localhost -U treasury_migrator -d treasury_test \
            -c "CREATE ROLE treasury_app WITH LOGIN PASSWORD 'treasury';" \
            -c "GRANT CONNECT ON DATABASE treasury_test TO treasury_app;"
      - run: pnpm db:migrate
      - run: pnpm test:integration
