services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: treasury_migrator
      POSTGRES_PASSWORD: treasury
      POSTGRES_DB: treasury_dev
    ports:
      - '5432:5432'
    volumes:
      - treasury_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U treasury_migrator -d treasury_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  treasury_pgdata:
